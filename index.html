<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NeuroSeq Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F6F7F5;
            --surface: #FFFFFF;
            --text: #1A2332;
            --text-secondary: #5B6472;
            --border: #E2E5E9;
            --accent: #2D5F4C;
            --accent-dark: #1F4335;
            --font-display: 'Fraunces', serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * { box-sizing: border-box; }

        html {
            background: var(--bg);
        }

        body {
            font-family: var(--font-body);
            color: var(--text);
            max-width: 720px;
            margin: 0 auto;
            padding: 56px 24px 80px;
            line-height: 1.5;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('cerebro-fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            opacity: 0.14;
            z-index: -1;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.4rem;
            font-weight: 600;
            margin: 0 0 12px;
            letter-spacing: -0.01em;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 56ch;
            margin: 0 0 48px;
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 16px;
        }

        section.bloco {
            padding-top: 32px;
            margin-top: 32px;
            border-top: 1px solid var(--border);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            --cor: #999;
            background: var(--surface);
            border: 1.5px solid var(--cor);
            color: var(--cor);
            font-family: var(--font-body);
            font-weight: 500;
            font-size: 0.92rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .chip:hover, .chip.ativo {
            background: var(--cor);
            color: white;
        }

        ul.lista-genes {
            list-style: none;
            padding: 0;
            margin: 16px 0 0;
        }

        ul.lista-genes li {
            display: flex;
            align-items: baseline;
            gap: 12px;
            padding: 10px 0 10px 14px;
            border-left: 3px solid var(--cor-item, var(--border));
            margin-bottom: 6px;
            background: var(--surface);
        }

        .gene-btn {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 0.9rem;
            background: none;
            border: none;
            color: var(--accent-dark);
            cursor: pointer;
            padding: 2px 0;
            text-decoration: underline;
            text-decoration-color: var(--border);
            text-underline-offset: 3px;
        }

        .gene-btn:hover {
            text-decoration-color: var(--accent-dark);
        }

        .gene-nome {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }

        .painel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 4px solid var(--cor-painel, var(--accent));
            border-radius: 4px;
            padding: 20px 24px;
            margin-top: 16px;
        }

        .painel h3 {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            margin: 0 0 8px;
        }

        .painel .descricao {
            color: var(--text-secondary);
            font-size: 0.94rem;
            margin-bottom: 18px;
        }

        .estatisticas {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            margin-bottom: 8px;
        }

        .stat {
            min-width: 100px;
        }

        .stat .valor {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 500;
        }

        .stat .rotulo {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .proteina-box {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            word-break: break-all;
            color: var(--text-secondary);
            margin-top: 14px;
        }

        .artigos {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .artigos h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 0 8px;
        }

        .artigos ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .artigos li {
            font-size: 0.88rem;
            margin-bottom: 8px;
        }

        .artigos a {
            color: var(--accent-dark);
        }

        select {
            font-family: var(--font-body);
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.92rem;
        }

        .botao {
            font-family: var(--font-body);
            font-weight: 500;
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.92rem;
        }

        .botao:hover {
            background: var(--accent-dark);
        }

        .linha-comparar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.88rem;
            background: var(--surface);
        }

        th {
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 10px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
        }

        tr:hover td {
            background: var(--bg);
        }
    </style>
</head>
<body>

    <header>
        <h1>NeuroSeq Explorer</h1>
        <p class="tagline">Busca sequências reais de genes ligados a neurotransmissores no NCBI e roda análises de bioinformática sobre elas — conteúdo GC, transcrição, tradução e identificação de ORFs — na hora.</p>
    </header>

    <section class="bloco">
        <h2>Escolha um sistema de neurotransmissores</h2>
        <div class="chips" id="chips"></div>
        <div id="resultado"></div>
    </section>

    <section class="bloco">
        <div id="analise"></div>
    </section>

    <section class="bloco">
        <h2>Comparar dois genes</h2>
        <div class="linha-comparar">
            <select id="seletorGene1"></select>
            <select id="seletorGene2"></select>
            <button class="botao" onclick="compararGenes()">Comparar</button>
        </div>
        <div id="comparacao"></div>
    </section>

    <section class="bloco">
        <h2>Histórico de análises</h2>
        <button class="botao" onclick="mostrarHistorico()">Ver histórico</button>
        <div id="historico"></div>
    </section>

    <script>
        const CORES = {
            dopamina: "#C97A2C",
            serotonina: "#2B7A78",
            gaba: "#6B5B95",
            glutamato: "#B33F3F",
            acetilcolina: "#3D7A45",
            noradrenalina: "#C2571B",
            histamina: "#B0447C",
            glicina: "#2E7DA8",
            opioides: "#5C3A8E"
        };

        const ROTULOS = {
            dopamina: "Dopamina",
            serotonina: "Serotonina",
            gaba: "GABA",
            glutamato: "Glutamato",
            acetilcolina: "Acetilcolina",
            noradrenalina: "Noradrenalina",
            histamina: "Histamina",
            glicina: "Glicina",
            opioides: "Opioides"
        };

        function criarChips() {
            const container = document.getElementById("chips");
            let html = "";
            for (const chave in ROTULOS) {
                html += `<button class="chip" id="chip-${chave}" style="--cor: ${CORES[chave]}" onclick="mostrarGenes('${chave}')">${ROTULOS[chave]}</button>`;
            }
            container.innerHTML = html;
        }

        async function mostrarGenes(neurotransmissor) {
            document.querySelectorAll(".chip").forEach(c => c.classList.remove("ativo"));
            document.getElementById("chip-" + neurotransmissor).classList.add("ativo");

            const resposta = await fetch("http://127.0.0.1:8000/genes");
            const dados = await resposta.json();
            const genes = dados[neurotransmissor];
            const cor = CORES[neurotransmissor];

            let html = "<ul class=\"lista-genes\">";
            for (const gene of genes) {
                html += `<li style="--cor-item: ${cor}"><button class="gene-btn" onclick="analisarGene('${gene.gene}', '${cor}')">${gene.gene}</button><span class="gene-nome">${gene.nome_completo}</span></li>`;
            }
            html += "</ul>";

            document.getElementById("resultado").innerHTML = html;
        }

        async function analisarGene(nomeGene, cor) {
            const corPainel = cor || "#2D5F4C";
            document.getElementById("analise").innerHTML = `<p style="color: var(--text-secondary)">Buscando e analisando ${nomeGene}...</p>`;

            const resposta = await fetch("http://127.0.0.1:8000/buscar-gene/" + nomeGene);
            const dados = await resposta.json();

            let html = `<div class="painel" style="--cor-painel: ${corPainel}">`;
            html += `<h3>${dados.gene}</h3>`;

            if (dados.info) {
                html += `<p class="descricao"><strong>${dados.info.nome_completo}</strong> — ${dados.info.descricao}</p>`;
            }

            html += `<div class="estatisticas">`;
            html += `<div class="stat"><div class="valor">${dados.gc.toFixed(2)}%</div><div class="rotulo">Conteúdo GC</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.orfs.length}</div><div class="rotulo">ORFs encontrados</div></div>`;
            html += `</div>`;

            html += `<div class="proteina-box">${dados.proteina}</div>`;

            if (dados.artigos_recentes.length > 0) {
                html += `<div class="artigos"><h4>Artigos recentes (PubMed)</h4><ul>`;
                for (const artigo of dados.artigos_recentes) {
                    html += `<li><a href="${artigo.link}" target="_blank">${artigo.titulo}</a> — ${artigo.revista} (${artigo.data_publicacao})</li>`;
                }
                html += `</ul></div>`;
            }

            html += `</div>`;
            document.getElementById("analise").innerHTML = html;
        }

        async function popularSeletores() {
            const resposta = await fetch("http://127.0.0.1:8000/genes");
            const dados = await resposta.json();

            const todosGenes = [];
            for (const categoria in dados) {
                for (const gene of dados[categoria]) {
                    todosGenes.push(gene);
                }
            }

            const seletor1 = document.getElementById("seletorGene1");
            const seletor2 = document.getElementById("seletorGene2");

            for (const gene of todosGenes) {
                const opcao1 = document.createElement("option");
                opcao1.value = gene.gene;
                opcao1.textContent = gene.gene + " — " + gene.nome_completo;
                seletor1.appendChild(opcao1);

                const opcao2 = opcao1.cloneNode(true);
                seletor2.appendChild(opcao2);
            }
        }

        async function compararGenes() {
            const gene1 = document.getElementById("seletorGene1").value;
            const gene2 = document.getElementById("seletorGene2").value;

            document.getElementById("comparacao").innerHTML = `<p style="color: var(--text-secondary)">Comparando ${gene1} e ${gene2}...</p>`;

            const resposta = await fetch("http://127.0.0.1:8000/comparar-genes/" + gene1 + "/" + gene2);
            const dados = await resposta.json();

            let html = `<div class="painel">`;
            html += `<h3>${gene1} vs ${gene2}</h3>`;
            html += `<div class="estatisticas">`;
            html += `<div class="stat"><div class="valor">${dados.sequencia_1.gc.toFixed(2)}%</div><div class="rotulo">GC ${gene1}</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.sequencia_2.gc.toFixed(2)}%</div><div class="rotulo">GC ${gene2}</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.comparacao.diferenca_gc.toFixed(2)}</div><div class="rotulo">Diferença de GC</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.comparacao.diferenca_tamanho}</div><div class="rotulo">Diferença de tamanho</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.comparacao.proteinas_identicas ? "Sim" : "Não"}</div><div class="rotulo">Proteínas idênticas</div></div>`;
            html += `<div class="stat"><div class="valor">${dados.comparacao.diferenca_quantidade_orfs}</div><div class="rotulo">Diferença de ORFs</div></div>`;
            html += `</div></div>`;

            document.getElementById("comparacao").innerHTML = html;
        }

        async function mostrarHistorico() {
            document.getElementById("historico").innerHTML = `<p style="color: var(--text-secondary)">Carregando histórico...</p>`;

            const resposta = await fetch("http://127.0.0.1:8000/historico");
            const dados = await resposta.json();

            if (dados.length === 0) {
                document.getElementById("historico").innerHTML = `<p style="color: var(--text-secondary)">Nenhuma análise salva ainda.</p>`;
                return;
            }

            let html = "<table><tr><th>Gene</th><th>GC (%)</th><th>ORFs</th><th>Data/Hora</th></tr>";
            for (const item of dados) {
                html += `<tr><td>${item.gene}</td><td>${item.gc.toFixed(2)}</td><td>${item.quantidade_orfs}</td><td>${item.data_hora}</td></tr>`;
            }
            html += "</table>";

            document.getElementById("historico").innerHTML = html;
        }

        criarChips();
        popularSeletores();
    </script>

</body>
</html>
